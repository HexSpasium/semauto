<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEM AUTO Yönetim</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css?v=20261116-2"></head><body><header><a href="index.html">SEM <i>AUTO</i><small>YÖNETİM MERKEZİ</small></a><a href="index.html">← VİTRİNE DÖN</a></header><main><section id="login" class="login"><small>YÖNETİCİ ERİŞİMİ</small><h1>YÖNETİCİ <i>GİRİŞİ</i></h1><form id="loginForm"><label>E-POSTA<input id="email" type="email" required></label><label>ŞİFRE<input id="password" type="password" required></label><button>GİRİŞ YAP →</button><p id="loginError"></p></form></section><section id="panel" hidden><div class="title"><div><small>SEM AUTO • YÖNETİM</small><h1>ARAÇ <i>STOKU</i></h1></div><button id="logout" class="light">ÇIKIŞ</button></div><div class="layout"><form id="vehicleForm" class="card"><h2 id="formTitle">ARAÇ EKLE</h2><input id="id" type="hidden"><div class="fields"><label>MARKA<input id="brand" required></label><label>MODEL<input id="model" required></label><label>PAKET<input id="trim"></label><label>YIL<input id="year" type="number" min="1950" max="2100" required></label><label>KİLOMETRE<input id="km" type="number" min="0" required></label><label>FİYAT TL<input id="price" type="number" min="0" required></label><label>YAKIT<select id="fuel"><option>Benzin</option><option>Dizel</option><option>Hibrit</option><option>Elektrik</option><option>LPG</option></select></label><label>VİTES<select id="gear"><option>Otomatik</option><option>Manuel</option><option>Yarı Otomatik</option></select></label><label>KASA<select id="body"><option>Sedan</option><option>SUV</option><option>Hatchback</option><option>Coupe</option><option>Diğer</option></select></label><label>İLAN DURUMU<select id="status"><option value="satilik">Satılık</option><option value="rezerve">Rezerve</option><option value="satildi">Satıldı</option></select></label><label class="wide">DEĞİŞEN PARÇALAR (virgülle ayırın)<input id="replaced"></label><label class="wide">BOYALI PARÇALAR (virgülle ayırın)<input id="painted"></label><label class="wide">HASAR / TRAMER<textarea id="damage"></textarea></label><label class="wide">AÇIKLAMA<textarea id="description"></textarea></label><label class="wide">KAPAK FOTOĞRAFI<input id="cover" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="wide">GALERİ FOTOĞRAFLARI<input id="gallery" type="file" multiple accept="image/jpeg,image/png,image/webp"></label></div><label class="check"><input id="active" type="checkbox" checked> Web sitesinde yayınla</label><button id="save">ARACI KAYDET →</button><button type="button" id="cancel" class="light" hidden>VAZGEÇ</button><p id="message"></p></form><section class="card"><h2>MEVCUT İLANLAR</h2><div id="list"></div></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="admin.js?v=20261116-2"></script></body></html>
